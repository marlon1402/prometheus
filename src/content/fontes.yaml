# Fontes citadas nas lições. A chave é o id usado no cabeçalho da lição
# (referencias e complementares) e nas chamadas do texto: <Ref id="halliday" />.
#
# Os campos seguem a ordem da referência ABNT (NBR 6023):
#   AUTOR. Capítulo. In: AUTOR. Título: subtítulo. Nota. Edição. Local: Editora, ano. Trecho.
#   Disponível em: url. Acesso em: data.
# Autores no formato “SOBRENOME, Nome”; instituições em maiúsculas.
# Itens marcados com “conferir” dependem do exemplar ou da versão consultada.

# Obras-base

halliday:
  autores: ["HALLIDAY, David", "RESNICK, Robert", "WALKER, Jearl"]
